<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Quizzes</title>
<!-- Importing modern typography -->
<link href="https://googleapis.com" rel="stylesheet">
<style>
/* Sleek Cyberpunk/Dark Mode Palette */
:root {
--primary: #3b82f6; /* Vibrant neon blue */
--secondary: #94a3b8; /* Muted slate text */
--bg: #0f172a; /* Deep dark slate background */
--card-bg: #1e293b; /* Card background */
--card-hover: #293548; /* Card hover state */
--text: #f8fafc; /* Off-white readable text */
--accent-glow: rgba(59, 130, 246, 0.15);
}
body {
font-family: 'Inter', sans-serif;
background-color: var(--bg);
color: var(--text);
margin: 0;
padding: 40px 20px;
}
.container {
max-width: 1100px;
margin: 0 auto;
}
header {
display: flex;
flex-direction: column;
align-items: center;
text-align: center;
margin-bottom: 50px;
margin-top: 20px;
gap: 15px;
}
.header-text h1 {
font-size: 2rem;
color: #ffffff;
margin: 5px 0;
font-weight: 700;
letter-spacing: -0.025em;
}
.header-text p {
color: var(--secondary);
font-size: 1.1rem;
margin: 0;
}
/* Desktop Layout Override */
@media (min-width: 768px) {
header {
flex-direction: row;
justify-content: space-between;
text-align: left;
}
.header-text h1 {
font-size: 2.5rem;
}
}
/* Responsive Grid System */
.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
gap: 25px;
}
/* Game Navigation Cards */
.game-card {
background: var(--card-bg);
border-radius: 16px;
padding: 20px;
text-decoration: none;
color: inherit;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
border: 1px solid #334155;
display: flex;
flex-direction: column;
position: relative;
overflow: hidden;
gap: 15px;
}
/* Custom Left Border Accents Per Game Card */
.tier-primary-game { border-left: 6px solid #10b981; } /* Emerald */
.tier-secondary-game { border-left: 6px solid #f59e0b; } /* Amber */
.tier-archive-game { border-left: 6px solid #ef4444; } /* Red */

.game-card:hover {
transform: translateY(-4px);
background: var(--card-hover);
box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.4), 0 4px 12px var(--accent-glow);
border-color: var(--primary);
}
/* Game Level Image Preview Style - Optimized for Mobile Screen Proportions */
.level-preview {
width: 100%;
height: 260px;
object-fit: contain; /* Entire mobile interface will fit perfectly without clipping */
border-radius: 8px;
background-color: #0f172a; /* Solid internal canvas framing */
box-sizing: border-box;
padding: 4px;
}
.card-footer {
display: flex;
justify-content: space-between;
align-items: center;
width: 100%;
}
.game-info h2 {
margin: 0;
font-size: 1.35rem;
font-weight: 700;
color: #ffffff;
}
.game-info span {
font-size: 0.8rem;
color: var(--secondary);
text-transform: uppercase;
letter-spacing: 0.075em;
font-weight: 600;
}
.arrow {
font-size: 1.5rem;
color: var(--primary);
transition: transform 0.2s ease;
}
.game-card:hover .arrow {
transform: translateX(4px);
}
footer {
text-align: center;
margin-top: 80px;
color: var(--secondary);
font-size: 0.9rem;
border-top: 1px solid #334155;
padding-top: 20px;
}
</style>
</head>
